name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']   # 纯文档改动不跑
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

# 串行化同一分支的 run（有发布/部署时防旧覆盖新）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── L1+L3 检查流水线：依赖安装（锁文件校验）→ 全库 lint → 测试+覆盖率门禁 ──
  # 门槛与本地 scripts/check.sh 完全同源（同一份脚本）。
  # OS 矩阵：代码在 Windows（本地开发）与 Linux（线上 + CI）双端运行，
  # 反斜杠路径、权限位、平台后缀二进制名这类雷只有矩阵才抓得住。
  check:
    name: lint + test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # requirements.txt 锁定 pandas 3.0.1（requires-python >=3.11）
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # windows runner 默认是 pwsh，bash 语法步骤必须显式指定
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install project (editable)
        # 只装 requirements-dev 不装项目本身：pytest 收集期会
        # ModuleNotFoundError: No module named 'trader_analysis'（首跑 exit 2 实测）。
        run: python -m pip install -e .
      - name: Run check (ruff full repo + pytest with coverage gate)
        run: bash scripts/check.sh

  # ── L2 安全扫描：gitleaks 全历史密钥扫描（独立 job，不阻塞上游）─────────
  security:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
