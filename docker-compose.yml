version: "3.8"

services:
  trader-api:
    build: .
    command: all  # API server + cron scheduler
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # SQLite 持久化
      - ./logs:/app/logs          # 日志持久化
    environment:
      - TZ=Asia/Shanghai
      - FUTU_OPEND_HOST=${FUTU_OPEND_HOST:-host.docker.internal}
      - FUTU_OPEND_PORT=${FUTU_OPEND_PORT:-11111}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 一次性初始化（首次部署时手动运行）
  # docker compose run --rm trader-init
  trader-init:
    build: .
    command: init
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - FUTU_OPEND_HOST=${FUTU_OPEND_HOST:-host.docker.internal}
      - FUTU_OPEND_PORT=${FUTU_OPEND_PORT:-11111}
    profiles:
      - init  # 不随 docker compose up 启动，需手动 run
