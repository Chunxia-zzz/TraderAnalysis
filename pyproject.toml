[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-analysis"
version = "0.2.0"
description = "Quant indicators, signals, backtest, and (later) live notify."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TraderAnalysis" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "fastapi>=0.115",
  "requests>=2.32",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "watchfiles>=0.21"]

[project.scripts]
trader-analysis = "trader_analysis.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
