  server {
      listen 80;
      server_name 47.106.175.84;

      root /var/www/trader-frontend;
      index index.html;

      location / {
          try_files $uri $uri/ /index.html;
      }

      # Vite 产物文件名带内容 hash → 内容变则文件名变，可永久强缓存。
      # 注意：只用 add_header 设置 Cache-Control，**不叠加 expires 指令**，
      #       否则 nginx 会输出两个 Cache-Control 头（expires 自带 max-age）。
      location /assets/ {
          add_header Cache-Control "public, max-age=31536000, immutable";
          access_log off;
      }

      # index.html 必须每次校验：它引用带 hash 的 chunk 名，
      # 一旦被启发式缓存，新部署后仍会去请求已删除的旧 chunk → 白屏。
      # no-cache = 每次都带 ETag 重验证，命中则 304，成本极低。
      location = /index.html {
          add_header Cache-Control "no-cache";
      }

      location /api {
          proxy_pass http://127.0.0.1:8000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
      }

      location /v1 {
          proxy_pass http://127.0.0.1:8000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
      }

      location /health {
          proxy_pass http://127.0.0.1:8000;
      }
  }
