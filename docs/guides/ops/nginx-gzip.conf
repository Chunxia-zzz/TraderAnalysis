# ── gzip 压缩（2026-10-12 新增）────────────────────────────────────────────
# 背景：nginx.conf 第 29 行的 #gzip on 一直是注释状态，线上 JS 原样传输
#       （index 主包 1531 KB 未压缩）。本文件只做响应体压缩，
#       不改任何静态产物、不需要重新构建前端。删除本文件即可完全回滚。
gzip              on;
gzip_vary         on;          # 加 Vary: Accept-Encoding，避免代理缓存串味
gzip_proxied      any;         # /api 反代响应也压缩（利弗莫尔 signals JSON 较大）
gzip_comp_level   5;           # 5 是压缩率/CPU 的平衡点
gzip_min_length   1024;        # 小于 1KB 不值得压（压缩反而增加开销）
gzip_disable      "msie6";
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/woff;
    # 注：font/woff2 本身已是压缩格式，再 gzip 几乎无收益只耗 CPU → 不列
